<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;600&display=block">
<style>
/* One 1080x1920 frame of a Cairo Quran reel. render(t) draws time t; build.mjs screenshots each frame.
   Text stays out of the top 240px and bottom 380px, where Reels puts its own buttons and caption. */
*{margin:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070b1c;color:#fdf6e9}
canvas{position:absolute;inset:0}
#photo{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:blur(34px) grayscale(.5) brightness(.42)}
.card{width:460px;height:580px;border-radius:26px;border:5px solid #e8c27a;background-size:cover;background-position:center 18%;box-shadow:0 30px 90px rgba(0,0,0,.65)}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,11,28,.35),rgba(7,11,28,.55) 50%,rgba(7,11,28,.85))}
.brand{position:absolute;top:258px;left:0;right:0;text-align:center;font:700 46px Amiri;direction:ltr;color:#fdf6e9}
.brand b{color:#e8c27a}
.reciter{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{width:330px;height:330px;border-radius:50%;padding:8px;background:conic-gradient(from 0deg,#e8c27a,#8a6a2e,#e8c27a,#8a6a2e,#e8c27a);box-shadow:0 0 60px rgba(232,194,122,.25)}
.ring div{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center 25%;filter:grayscale(.15)}
.chip{display:flex;align-items:center;gap:22px;direction:rtl}
.chip .ph{flex:none;width:120px;height:120px;border-radius:50%;background-size:cover;background-position:center 25%;border:4px solid #e8c27a}
.name{font:700 58px Amiri;color:#fdf6e9}
.label{font:400 32px "Readex Pro";color:#e8c27a;letter-spacing:.02em}
.verse{position:absolute;left:80px;right:80px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;column-gap:.32em;
  font-family:"Amiri Quran",Amiri,serif;line-height:2.05;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.55)}
.verse span{transition:none;color:#fdf6e9}
.verse span.mark{color:#e8c27a;font-family:Amiri,serif}
.ref{position:absolute;left:0;right:0;text-align:center;font:400 36px "Readex Pro";color:#e8c27a}
.series{position:absolute;top:338px;left:0;right:0;display:flex;justify-content:center}
.series span{font:600 30px "Readex Pro";color:#1b1206;background:#e8c27a;border-radius:999px;padding:8px 30px}
.hook{position:absolute;top:410px;left:90px;right:90px;text-align:center;font:600 54px/1.45 "Readex Pro";color:#fdf6e9;text-shadow:0 4px 24px rgba(0,0,0,.7)}
.note{position:absolute;left:110px;right:110px;text-align:center;font:400 34px/1.6 "Readex Pro";color:rgba(253,246,233,.9);text-shadow:0 2px 16px rgba(0,0,0,.7)}
.credit{position:absolute;top:1505px;left:0;right:0;text-align:center;font:300 20px "Readex Pro";color:rgba(253,246,233,.55)}
#photo.place{filter:brightness(.62) saturate(.9)}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.end .t{font:700 104px Amiri;direction:ltr}.end .t b{color:#e8c27a}
.end .s{font:300 44px "Readex Pro";line-height:1.6;color:rgba(253,246,233,.86)}
.end .u{font:400 48px "Readex Pro";color:#e8c27a;direction:ltr;letter-spacing:.04em;margin-top:10px}
</style>
</head>
<body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="pwrap" style="position:absolute;inset:0;overflow:hidden"><div id="photo" hidden></div></div>
<div class="shade" id="shade" hidden></div>
<div class="brand" id="brand"><b>Cairo</b> Quran</div>
<div class="series" id="series" hidden><span></span></div>
<div class="hook" id="hook" hidden></div>
<div class="reciter" id="reciter"></div>
<div class="verse" id="verse"></div>
<div class="ref" id="ref"></div>
<div class="note" id="note" hidden></div>
<div class="credit" id="credit" hidden></div>
<div class="end" id="end"><div class="t"><b>Cairo</b> Quran</div><div class="s" id="endLines"></div><div class="u">cairoquran.com</div></div>
<script>
const W = 1080, H = 1920, cv = document.getElementById('bg'), c = cv.getContext('2d');
const $ = id => document.getElementById(id);
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const win = (t, a, b) => ease((t - a) / (b - a));
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const stars = [...Array(80)].map((_, i) => ({ x: (Math.sin(i * 91.7) * .5 + .5) * W, y: (Math.sin(i * 37.3) * .5 + .5) * H * .8, r: 1 + (i * 7 % 3) * .7, p: i * .9 }));
const THEMES = {
  night: ['#0a1230', '#22305c', 'rgba(232,194,122,.12)'],
  dawn: ['#141f45', '#9c6a4a', 'rgba(255,214,150,.20)']
};
let D = null, spans = [];

function star8(x, y, r) { c.beginPath(); for (let k = 0; k < 2; k++) { const a0 = k * Math.PI / 4; for (let i = 0; i < 4; i++) { const a = a0 + i * Math.PI / 2, px = x + r * Math.cos(a), py = y + r * Math.sin(a); i ? c.lineTo(px, py) : c.moveTo(px, py); } c.closePath(); } c.stroke(); }

window.setup = function (data) {
  D = data;
  $('endLines').replaceChildren(...['تلاوات كبار القرّاء', D.radios || 'إذاعات القرآن الكريم', 'مواقيت الصلاة لمدينتك · الأذكار'].flatMap((l, i) => i ? [document.createElement('br'), l] : [l]));
  const st = D.style;
  if (st === 'cinema') { $('photo').hidden = false; $('shade').hidden = false; $('photo').style.backgroundImage = `url(${D.photo})`; }
  if (st === 'place') { $('photo').hidden = false; $('shade').hidden = false; $('photo').classList.add('place'); $('photo').style.backgroundImage = `url(${D.bg})`;
    $('photo').style.backgroundPosition = 'center'; if (D.credit) { $('credit').hidden = false; $('credit').textContent = D.credit; } }
  if (D.series) { $('series').hidden = false; $('series').firstChild.textContent = D.series; }
  if (D.hook) { $('hook').hidden = false; $('hook').textContent = D.hook; }
  const rc = $('reciter');
  if (st === 'circle') { rc.innerHTML = `<div class="ring"><div style="background-image:url(${D.photo})"></div></div><div class="name"></div><div class="label"></div>`; rc.style.top = '360px'; }
  else if (st === 'place') { rc.innerHTML = `<div class="chip"><div class="ph" style="background-image:url(${D.photo})"></div><div><div class="name"></div><div class="label"></div></div></div>`; rc.style.top = D.hook ? '590px' : '420px'; }
  else if (st === 'wave') { rc.innerHTML = `<div class="chip"><div class="ph" style="background-image:url(${D.photo})"></div><div><div class="name"></div><div class="label"></div></div></div>`; rc.style.top = '360px'; }
  else { rc.innerHTML = `<div class="card" style="background-image:url(${D.photo})"></div><div class="name"></div><div class="label"></div>`; rc.style.top = '350px'; }
  rc.querySelector('.name').textContent = D.reciter;
  rc.querySelector('.label').textContent = D.label;
  const v = $('verse');
  D.words.forEach(w => { const s = document.createElement('span'); s.textContent = w.text; if (w.mark) s.className = 'mark'; v.appendChild(s); spans.push(s); });
  const box = st === 'circle' ? [880, 1500] : st === 'wave' ? [600, 1330] : st === 'place' ? [D.hook ? 790 : 640, D.note ? 1270 : 1400] : [1110, 1465];
  v.style.top = box[0] + 'px'; v.style.height = (box[1] - box[0]) + 'px';
  let size = 104; v.style.fontSize = size + 'px';
  while ((v.scrollHeight > v.clientHeight + 2 || v.scrollWidth > v.clientWidth + 2) && size > 44) { size -= 4; v.style.fontSize = size + 'px'; }
  $('ref').textContent = D.ref;
  $('ref').style.top = (st === 'cinema' ? 1500 : st === 'wave' ? 1360 : st === 'place' ? (D.note ? 1290 : 1420) : 1515) + 'px';
  if (D.note) { $('note').hidden = false; $('note').textContent = D.note; $('note').style.top = '1360px'; }
};

window.render = function (t) {
  const st = D.style, total = D.total, endAt = total - D.outro;
  // background
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (st !== 'cinema' && st !== 'place') {
    const th = THEMES[st === 'wave' ? 'dawn' : 'night'];
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, th[0]); g.addColorStop(1, th[1]); c.fillStyle = g; c.fillRect(0, 0, W, H);
    const rg = c.createRadialGradient(W / 2, H * .45, 10, W / 2, H * .45, W * .95); rg.addColorStop(0, th[2]); rg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = rg; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(232,194,122,.05)'; c.lineWidth = 2; const sp = 135;
    for (let y = -sp / 2, row = 0; y < H + sp; y += sp * .866, row++) for (let x = (row % 2 ? sp / 2 : 0) - sp / 2; x < W + sp; x += sp) star8(x, y, 30);
    stars.forEach(s => { c.fillStyle = `rgba(253,246,233,${.2 + .45 * (.5 + .5 * Math.sin(t * 1.5 + s.p))})`; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 7); c.fill(); });
  } else {
    c.clearRect(0, 0, W, H);
    const z = 1.18 + .06 * Math.min(t / total, 1);
    $('photo').style.transform = `scale(${z})`;
    const cd = document.querySelector('.card'); if (cd) cd.style.transform = `scale(${1 + .035 * Math.min(t / total, 1)})`;
  }
  if (st === 'wave' && D.env) {
    const i = Math.max(0, Math.min(D.env.length - 1, Math.floor((t - D.intro) * 30)));
    const n = 48, bw = 10, gap = 8, x0 = (W - n * (bw + gap)) / 2, yc = 1500;
    c.fillStyle = 'rgba(232,194,122,.75)';
    for (let k = 0; k < n; k++) {
      const e = D.env[Math.max(0, i - Math.abs(k - n / 2))] || 0;
      const h = 8 + e * 150 * (0.55 + 0.45 * Math.sin(k * 1.7 + t * 3) ** 2);
      c.fillRect(x0 + k * (bw + gap), yc - h / 2, bw, h);
    }
  }
  const pad = 46; c.strokeStyle = 'rgba(232,194,122,.5)'; c.lineWidth = 2.5; c.strokeRect(pad, pad, W - pad * 2, H - pad * 2);
  c.fillStyle = `rgba(5,8,22,${1 - win(t, 0, .25)})`; c.fillRect(0, 0, W, H);

  const out = win(t, endAt, endAt + .5), endIn = win(t, endAt + .3, endAt + 1);
  $('brand').style.opacity = win(t, 0, .4) * (1 - out);
  const rc = $('reciter'); rc.style.opacity = win(t, 0, .5) * (1 - out); rc.style.transform = `translateY(${(1 - win(t, 0, .5)) * 24}px)`;
  if (st === 'circle') rc.querySelector('.ring').style.transform = `rotate(${t * 6}deg)`, rc.querySelector('.ring div').style.transform = `rotate(${-t * 6}deg)`;
  const at = t - D.intro;
  D.words.forEach((w, i) => {
    const s = spans[i];
    let o = .22, col = '#fdf6e9';
    if (at >= w.start) { o = 1; col = at < w.end ? '#e8c27a' : (w.mark ? '#e8c27a' : '#fdf6e9'); }
    else if (at >= w.start - .35) o = .22 + .78 * win(at, w.start - .35, w.start);
    s.style.opacity = o * Math.min(1, win(t, 0, .3) + .0001); s.style.color = col;
  });
  $('verse').style.opacity = 1 - out;
  $('ref').style.opacity = win(t, .2, .8) * (1 - out);
  for (const [id, a0] of [['series', 0], ['hook', 0], ['note', .4], ['credit', .4]]) $(id).style.opacity = win(t, a0, a0 + .5) * (1 - out);
  const e = $('end'); e.style.opacity = endIn; e.style.transform = `translateY(${(1 - endIn) * 24}px)`;
};
</script>
</body>
</html>
