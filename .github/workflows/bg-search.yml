# Temporary: CC0 background photo search for reels (removed after use).
name: bg-search
on:
  push:
    branches: [claude/relaxed-volta-yog6yf]
    paths: ['.github/content/tools/bg/search.mjs']
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/content/tools/bg/search.mjs
      - run: sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y imagemagick >/dev/null && bash .github/content/tools/bg/sheets.sh
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add .github/content/tools/bg/out && git commit -m "bg search results" && git pull --rebase && git push
