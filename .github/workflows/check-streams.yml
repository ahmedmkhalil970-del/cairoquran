# Checks every six hours that all radio streams on the site are working.
# When a station is down it opens an issue (or comments on the open one) so the owner is notified,
# and closes it once every station is back. A station outage is a result, not a failure of this tool,
# so the run stays green; the run turns red only when the check itself cannot run. It only reads index.html; it never deploys or edits the site.
name: فحص روابط البث

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-streams

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: فحص الإذاعات
        id: check
        env:
          REPORT_FILE: ${{ runner.temp }}/stream-report.md
        run: node .github/scripts/check-streams.mjs index.html

      - name: فتح بلاغ أو تحديثه عند التعطّل
        if: steps.check.outputs.status == 'down'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ runner.temp }}/stream-report.md
        run: |
          gh label create stream-down --color B60205 --description "تعطّل في روابط البث" 2>/dev/null || true
          n=$(gh issue list --label stream-down --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --title "تعطّل في روابط البث" --label stream-down --body-file "$REPORT_FILE"
          else
            gh issue comment "$n" --body-file "$REPORT_FILE"
          fi

      - name: إغلاق البلاغ بعد عودة البث
        if: steps.check.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label stream-down --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "عادت جميع الإذاعات إلى العمل."
          done
