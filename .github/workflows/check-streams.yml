# Checks every six hours that all radio streams on the site are working.
# On failure it opens an issue (or comments on the open one) so the owner is notified,
# and closes it once every station is back. It only reads index.html; it never deploys or edits the site.
name: فحص روابط البث

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-streams

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: فحص الإذاعات
        id: check
        continue-on-error: true
        env:
          REPORT_FILE: ${{ runner.temp }}/stream-report.md
        run: node .github/scripts/check-streams.mjs index.html

      - name: فتح بلاغ أو تحديثه عند التعطّل
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ runner.temp }}/stream-report.md
        run: |
          gh label create stream-down --color B60205 --description "تعطّل في روابط البث" 2>/dev/null || true
          n=$(gh issue list --label stream-down --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --title "تعطّل في روابط البث" --label stream-down --body-file "$REPORT_FILE"
          else
            gh issue comment "$n" --body-file "$REPORT_FILE"
          fi

      - name: إغلاق البلاغ بعد عودة البث
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label stream-down --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "عادت جميع الإذاعات إلى العمل."
          done

      - name: إظهار الفشل في سجل التشغيل
        if: steps.check.outcome == 'failure'
        run: exit 1
