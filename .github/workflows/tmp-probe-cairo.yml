name: tmp-probe-cairo
on:
  push:
    branches: [tmp-probe-cairo]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
      - run: |
          for u in https://stream.radiojar.com/8s5u5tpdtwzuv https://n12.radiojar.com/8s5u5tpdtwzuv https://n0c.radiojar.com/8s5u5tpdtwzuv https://stream.radiojar.com/0tpy1h0kxtzuv; do
            echo "=================== $u"
            curl -sS -m 10 -o /dev/null -L -D - -r 0-2000 "$u" | grep -iE "^HTTP|^location|^content-type|^icy|^server" || true
            timeout 60 ffmpeg -hide_banner -nostdin -t 25 -i "$u" -af volumedetect -f null - 2>&1 | grep -E "Stream #|mean_volume|max_volume|Error|error|Duration|icy" | head -8 || true
          done
