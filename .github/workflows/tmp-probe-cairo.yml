name: tmp-probe-cairo
on:
  push:
    branches: [tmp-probe-cairo]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in https://n04.radiojar.com/8s5u5tpdtwzuv https://n10.radiojar.com/8s5u5tpdtwzuv https://n0c.radiojar.com/8s5u5tpdtwzuv https://n12.radiojar.com/8s5u5tpdtwzuv https://stream.radiojar.com/8s5u5tpdtwzuv.mp3; do
            printf '%s  ' "$u"; curl -sS -m 6 -o /dev/null -w 'code=%{http_code} bytes=%{size_download} redirect=%{redirect_url}\n' "$u" 2>&1 | tail -1
          done
