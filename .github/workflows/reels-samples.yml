# Renders the batch named in .github/reels/current and commits the videos to .github/reels/out on this branch.
# Runs only when that file changes, so ordinary pushes never add videos to the branch.
# Runs only on this working branch; it never touches main or the live site.
name: reels-samples
on:
  push:
    branches: [claude/relaxed-volta-yog6yf]
    paths: ['.github/reels/current']
permissions:
  contents: write
concurrency:
  group: reels-samples
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        working-directory: .github/reels
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
          npm i --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium > /dev/null
      - name: Render
        working-directory: .github/reels
        run: node build.mjs
      - name: Save videos to the branch
        run: |
          git config user.name "Ahmed Khalil"
          git config user.email "ahmedmkhalil970@gmail.com"
          git add .github/reels/out
          git commit -q -m "Render reels: $(cat .github/reels/current)" && git pull -q --rebase && git push -q || echo "nothing to commit"
