# Temporary: finds Commons photos for new landmarks (branch claude/landmarks-400 only). Removed before merging.
name: landmarks-find
on:
  push:
    branches: [claude/landmarks-400]
    paths: ['.github/landmarks/candidates.tsv', '.github/landmarks/find.mjs', '.github/landmarks/sheets.sh']
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/landmarks/find.mjs
      - run: sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y imagemagick >/dev/null
      - run: bash .github/landmarks/sheets.sh
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add .github/landmarks/out && git commit -m "landmarks: Commons search results" && git push
